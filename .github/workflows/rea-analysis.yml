# Copy to .github/workflows/rea-analysis.yml on your default branch.
name: REA oficial - certificacion

on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
  push:
    branches: [main]
    paths:
      - .github/workflows/rea-analysis.yml

permissions:
  contents: read

concurrency:
  group: rea-analysis-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ARTIFACT_PATH: build/rea-ci-demo
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Check for approved scheduled work
        id: queue
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "schedule" ]]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          elif [[ -f .rea/approved-target.txt ]]; then
            target=$(head -n 1 .rea/approved-target.txt)
            if [[ "$target" =~ ^rea-inputs/[A-Za-z0-9_./-]+$ && "$target" != *'..'* && -d "$target" ]]; then
              echo "ARTIFACT_PATH=$target" >> "$GITHUB_ENV"
              echo 'run=true' >> "$GITHUB_OUTPUT"
            else
              echo 'Invalid approved target path' >&2
              exit 1
            fi
          else
            echo 'No approved target; scheduled cycle is a no-op.'
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Prepare isolated report directory
        if: steps.queue.outputs.run == 'true'
        id: reports
        shell: bash
        run: |
          directory=$(mktemp -d "${RUNNER_TEMP:?}/rea-analysis.XXXXXX")
          printf 'directory=%s\n' "${directory}" >> "${GITHUB_OUTPUT:?}"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.queue.outputs.run == 'true'
        with:
          node-version: "24.22.1"
      - name: Install official published REA 6.8.0 (not the fork source)
        if: steps.queue.outputs.run == 'true'
        run: |
          npm install --prefix "${RUNNER_TEMP}/rea-tool" --no-audit --no-fund --ignore-scripts --save-exact rea-agents@6.8.0
          echo "${RUNNER_TEMP}/rea-tool/node_modules/.bin" >> "${GITHUB_PATH}"
      - name: Verify installed REA executable and MCP build
        if: steps.queue.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rea --version
          test -s "${RUNNER_TEMP}/rea-tool/node_modules/rea-agents/dist/mcp/main.js"
          test -s "${RUNNER_TEMP}/rea-tool/node_modules/rea-agents/dist/cli-runtime/cli.js"
      - name: MCP stdio handshake and tool discovery
        if: steps.queue.outputs.run == 'true'
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { spawn } from 'node:child_process';
          const child = spawn('rea', ['mcp'], { stdio: ['pipe', 'pipe', 'pipe'] });
          let buffer = '';
          let stderr = '';
          let initialized = false;
          let timer = setTimeout(() => fail('MCP handshake timeout'), 25000);
          child.stderr.on('data', d => { stderr += String(d).slice(0, 2000); });
          child.on('error', e => fail(String(e)));
          child.on('exit', code => { if (!initialized) fail('MCP exited: ' + code + ' ' + stderr); });
          child.stdout.on('data', chunk => {
            buffer += chunk.toString();
            while (buffer.includes('\n')) {
              const line = buffer.slice(0, buffer.indexOf('\n')).trim();
              buffer = buffer.slice(buffer.indexOf('\n') + 1);
              if (!line) continue;
              let msg;
              try { msg = JSON.parse(line); } catch { return fail('Non-JSON MCP response'); }
              if (msg.id === 1) {
                if (msg.error || !msg.result?.capabilities) return fail('initialize failed');
                send({ jsonrpc: '2.0', method: 'notifications/initialized' });
                send({ jsonrpc: '2.0', id: 2, method: 'tools/list', params: {} });
              }
              if (msg.id === 2) {
                if (msg.error || !Array.isArray(msg.result?.tools) || msg.result.tools.length === 0) return fail('tools/list failed');
                initialized = true;
                clearTimeout(timer);
                console.log('MCP initialized; tools available:', msg.result.tools.length);
                child.kill();
              }
            }
          });
          function send(msg) { child.stdin.write(JSON.stringify(msg) + '\n'); }
          function fail(reason) { clearTimeout(timer); console.error(reason); child.kill(); process.exitCode = 1; }
          send({ jsonrpc: '2.0', id: 1, method: 'initialize', params: { protocolVersion: '2025-03-26', capabilities: {}, clientInfo: { name: 'rea-ci-smoke', version: '1.0.0' } } });
          NODE
      - name: Build a known artifact
        if: steps.queue.outputs.run == 'true' && github.event_name != 'schedule'
        id: build
        run: |
          # Replace this step with your reviewed build, keeping ARTIFACT_PATH in sync.
          mkdir -p build/rea-ci-demo
          printf '%s\n' '{"name":"rea-ci-demo","version":"1.0.0","type":"module","main":"index.js"}' > build/rea-ci-demo/package.json
          printf '%s\n' 'export const message = "hello";' 'throw new Error("This artifact must not be executed.");' > build/rea-ci-demo/index.js
      - name: Analyze and retain the original exit status
        if: steps.queue.outputs.run == 'true'
        id: analyze
        shell: bash
        env:
          REPORT_DIR: ${{ steps.reports.outputs.directory }}
        run: |
          set +e
          rea analyze-javascript-application "${GITHUB_WORKSPACE}/${ARTIFACT_PATH}" --json --full-output \
            > "${REPORT_DIR}/analysis.json" 2> "${REPORT_DIR}/analysis.stderr"
          status=$?
          set -e
          printf '%s\n' "${status}" > "${REPORT_DIR}/exit-code.txt"
          if [ "${status}" -eq 0 ]; then
            node -e 'const fs=require("node:fs"); const report=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if (!report || typeof report !== "object" || Array.isArray(report) || !Object.keys(report).length) process.exit(1)' "${REPORT_DIR}/analysis.json"
          fi
          exit "${status}"
      - name: Upload available reports, including after analysis failure
        if: ${{ always() && steps.reports.outputs.directory != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rea-analysis
          path: ${{ steps.reports.outputs.directory }}
          if-no-files-found: warn
          retention-days: 7
